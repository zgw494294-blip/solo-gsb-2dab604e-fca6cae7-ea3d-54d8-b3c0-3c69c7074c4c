<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直流电路网表求解器</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>直流电路网表求解器</h1>
    <p class="hint">
      每行输入一个元件：<code>名称 起点 终点 数值</code>。名称首字母：
      <strong>R</strong>＝电阻（Ω，须为正）、<strong>V</strong>＝理想电压源（V，起点电位 − 终点电位 ＝ 数值）、
      <strong>I</strong>＝理想电流源（A，正方向：起点 → 终点）。
      节点 <code>0</code> 为地；最多 12 个非接地节点、30 个元件；名称不得重复；<code>#</code> 开头为注释。
    </p>

    <label class="label" for="netlist">网表</label>
    <textarea id="netlist" rows="10" spellcheck="false"
      placeholder="V1 1 0 12&#10;R1 1 2 6&#10;R2 2 0 6"></textarea>

    <div class="toolbar">
      <button id="solve-btn" class="primary">求解</button>
      <button id="example-btn" type="button">填入示例</button>
      <button id="clear-btn" type="button">清空</button>
    </div>

    <div id="error" class="error" role="alert" hidden></div>

    <section id="results" hidden>
      <h2>节点电压</h2>
      <table id="voltage-table">
        <thead>
          <tr><th>节点</th><th>电压 (V)</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <h2>元件电流（正方向：起点 → 终点）</h2>
      <table id="current-table">
        <thead>
          <tr><th>元件</th><th>类型</th><th>方向</th><th>电流 (A)</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
